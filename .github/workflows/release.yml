name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:        
  build:
    runs-on: windows-latest
    
    env:
      Solution_Name: VehicleMapFramework
      WorkshopMods: |
        3522907382  # Vehicle Framework (Unstable)
        3528683767  # Vehicle Map Framework (Dev)
      
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
        
    - name: Restore Cache
      id: cache-steam
      uses: actions/cache/restore@v6
      with:
        path: ./Steam
        key: steamcmd-initial
        restore-keys: |
          steamcmd-
        enableCrossOsArchive: true
        
    - name: Install SteamCMD
      if: steps.cache-steam.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        New-Item -ItemType Directory -Force -Path "Steam"
        cd Steam
        Invoke-WebRequest -Uri "https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip" -OutFile "steamcmd.zip"
        Expand-Archive -Path "steamcmd.zip" -DestinationPath "."
        Remove-Item "steamcmd.zip"
        
    - name: Download Workshop Mods
      shell: powershell
      run: |
        $modIds = @"
        ${{ env.WorkshopMods }}
        "@ -split "`n" | ForEach-Object { $_.Split('#')[0].Trim() } | Where-Object { $_ -ne "" }
        
        $scriptPath = "steam_script.txt"
        $commands = @("login anonymous")
        foreach ($id in $modIds) {
            $commands += "workshop_download_item 294100 $id validate"
        }
        $commands += "quit"
        $commands | Out-File -FilePath $scriptPath -Encoding ascii
        
        & "./Steam/steamcmd.exe" +runscript "../steam_script.txt"
        
        $LastExitCode = 0        
        if (Test-Path "Steam/steamapps/workshop/content/294100") {
            Write-Host "Workshop content verified."
        } else {
            exit 1
        }
    
    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 9.0.x
    
    - name: Restore Dependencies
      run: |
        dotnet restore Source/MapVehiclesOcean/MapVehiclesOcean/MapVehiclesOcean.csproj
    
    - name: Build DLL
      run: |
        $workshopRoot = "$pwd/Steam/steamapps/workshop/content/294100"
        dotnet build Source/MapVehiclesOcean/MapVehiclesOcean/MapVehiclesOcean.csproj --configuration Release --no-restore /p:CIBuild=true /p:SteamWorkshopRoot=$workshopRoot
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: MapVehiclesOcean
        path: |
          1.6
          2022.3
          About
          NanameWalls
          LICENSE
          LoadFolders.xml
    
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: Steam
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: MapVehiclesOcean
        path: MapVehiclesOcean
    
    - name: Deploy
      uses: m00nl1ght-dev/steam-workshop-deploy@v4
      with:
        username: ${{ secrets.STEAM_USERNAME }}          
        configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
        path: MapVehiclesOcean
        appId: 294100
        publishedFileId: 3528683767
        changeNote: ${{ github.ref_name }}

    - name: Discord Notification
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK_UPDATE }}
        title: 'Beta Update: ${{ github.ref_name }}'
        username: LS & Co. (GitHub Division)
        url: "https://steamcommunity.com/sharedfiles/filedetails/?id=3528683767"